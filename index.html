<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB TECH - Cloud Billing & Stock Management</title>
    
    <!-- Static Compiled Tailwind CSS (CSP Safe) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase App, Auth & Firestore SDK (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        /* Custom Clean Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app-container" class="flex-1 flex flex-col">
        <!-- Auth Screen -->
        <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-3xl max-w-md w-full p-8 shadow-2xl backdrop-blur-md">
                <div class="text-center mb-6">
                    <img id="app-logo-login" src="logo.jpeg" class="w-20 h-20 mx-auto rounded-2xl mb-4 shadow-lg object-cover border-2 border-indigo-500/50" alt="SB TECH Logo" onerror="this.style.display='none'">
                    <h1 class="font-extrabold text-2xl text-white tracking-tight">SB TECH Cloud</h1>
                    <p class="text-xs text-slate-400 mt-1 font-medium">Complete IT Support & Service Billing</p>
                </div>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                        <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="admin@sbtech.com.np">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-xs font-semibold text-slate-300">Password</label>
                            <button type="button" onclick="sendForgotPasswordReset()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition">Forgot Password?</button>
                        </div>
                        <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-bold text-white rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95">Login to System</button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="main-dashboard" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-slate-800/90 border-b border-slate-700/80 sticky top-0 z-40 backdrop-blur-md">
                <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <img id="app-logo-header" src="logo.jpeg" class="w-10 h-10 rounded-xl object-cover shadow-md border border-indigo-500/50" alt="SB TECH Logo" onerror="this.style.display='none'">
                        <div>
                            <h1 class="font-extrabold text-sm text-white tracking-wide flex items-center gap-2">
                                SB TECH <span id="role-badge" class="text-[10px] font-bold bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full uppercase border border-indigo-500/30"></span>
                            </h1>
                            <p class="text-[11px] text-slate-400 font-medium">Damak-5, Jhapa | VAT: 600714930</p>
                        </div>
                    </div>

                    <nav id="nav-tabs" class="flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-700/80 shadow-inner">
                        <!-- Dynamically rendered -->
                    </nav>

                    <div class="flex items-center gap-3 relative">
                        <!-- Notification Bell Icon (Fixed Right Positioned Dropdown) -->
                        <div class="relative">
                            <button onclick="toggleNotificationDropdown()" class="relative p-2.5 bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-xl transition border border-slate-600/60 flex items-center justify-center shadow-sm">
                                <i class="fa-solid fa-bell text-sm"></i>
                                <span id="low-stock-badge" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded-full hidden shadow">0</span>
                            </button>
                            <!-- Notification Dropdown Menu (Fixed right-0 alignment so it never cuts off) -->
                            <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-4 z-50 text-xs text-slate-200 backdrop-blur-md">
                                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700 font-bold text-rose-400">
                                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i> Low Stock Alerts</span>
                                    <button onclick="toggleNotificationDropdown()" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded-lg hover:bg-slate-700 transition">✕</button>
                                </div>
                                <div id="notification-list" class="max-h-64 overflow-y-auto space-y-2 pr-1">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>
                        </div>

                        <span id="user-email-display" class="text-xs text-slate-300 font-medium hidden sm:inline px-2 py-1 bg-slate-700/40 rounded-lg border border-slate-600/40"></span>
                        
                        <button onclick="openChangeMyPasswordModal()" class="px-3 py-2 bg-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition border border-slate-600/60 flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-key text-indigo-400"></i> Password
                        </button>
                        <button onclick="logout()" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white text-xs font-semibold rounded-xl transition border border-rose-500/30 flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="tab-content">
                <!-- Content injected here -->
            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>
    <div id="modal-container"></div>

    <script>
        const LOGO_SRC = "logo.jpeg";

        const firebaseConfig = {
            apiKey: "AIzaSyDmvvmLLbDR7RLUDpIz2y3dsu9zXORdlr8",
            authDomain: "sbtech-billing.firebaseapp.com",
            projectId: "sbtech-billing",
            storageBucket: "sbtech-billing.firebasestorage.app",
            messagingSenderId: "330652833543",
            appId: "1:330652833543:web:5adff75f4288b85f6e97a2",
            measurementId: "G-C7P9R3KGLB"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userRole = 'teller';
        let userPermissions = { pos: true, products: false, customers: false, statements: false, reports: false, users: false };
        let products = [];
        let customers = [];
        let sales = [];
        let systemUsers = [];
        let currentCart = [];
        let currentDiscount = 0;
        let activeTab = 'pos';
        let selectedCustomerId = '';
        let manualCustomerName = '';
        let manualCustomerAddress = '';
        let manualCustomerPhone = '';

        auth.onAuthStateChanged(async function(user) {
            if (user) {
                const isAllowed = await fetchUserPermissions(user.email);
                if (!isAllowed) {
                    showToast("Access Denied: Unregistered or Disabled User!", "error");
                    auth.signOut();
                    return;
                }

                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('role-badge').innerText = userRole.toUpperCase();
                
                setupNavigation();
                await loadCloudData();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.add('hidden');
            }
        });

        async function fetchUserPermissions(email) {
            try {
                if (email === 'admin@sbtech.com.np') {
                    userRole = 'admin';
                    userPermissions = { pos: true, products: true, customers: true, statements: true, reports: true, users: true };
                    return true;
                }

                const snap = await db.collection('users').where('email', '==', email).get();
                if (!snap.empty) {
                    const data = snap.docs[0].data();
                    if (data.disabled === true) return false;

                    userRole = data.role || 'teller';
                    userPermissions = data.permissions || { pos: true, products: false, customers: false, statements: false, reports: false, users: false };
                    return true;
                } else {
                    return false;
                }
            } catch (e) {
                console.error("Error fetching permissions:", e);
                return false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            
            try {
                if (email !== 'admin@sbtech.com.np') {
                    const checkUser = await db.collection('users').where('email', '==', email).get();
                    if (checkUser.empty) {
                        showToast("Login Failed: User not created by Admin!", "error");
                        return;
                    }
                    const uData = checkUser.docs[0].data();
                    if (uData.disabled === true) {
                        showToast("Account Disabled! Contact Admin.", "error");
                        return;
                    }
                }

                await auth.signInWithEmailAndPassword(email, pass);
                showToast("Login Successful!");
            } catch (err) {
                showToast("Invalid Email or Password!", "error");
            }
        }

        async function sendForgotPasswordReset() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showToast("Please enter your Email Address first!", "error");
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showToast("Password reset link sent to your email (" + email + ")");
            } catch (err) {
                showToast("Reset Failed: " + err.message, "error");
            }
        }

        function logout() {
            auth.signOut();
            showToast("Logged out successfully");
        }

        function setupNavigation() {
            const nav = document.getElementById('nav-tabs');
            let html = '';

            const activeClass = "px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
            const inactiveClass = "px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition flex items-center gap-2";

            if (userPermissions.pos) {
                html += `<button onclick="switchTab('pos')" id="tab-btn-pos" class="${activeTab === 'pos' ? activeClass : inactiveClass}"><i class="fa-solid fa-cart-shopping"></i> POS</button>`;
            }
            if (userPermissions.products) {
                html += `<button onclick="switchTab('products')" id="tab-btn-products" class="${activeTab === 'products' ? activeClass : inactiveClass}"><i class="fa-solid fa-boxes-stacked"></i> Stock</button>`;
            }
            if (userPermissions.customers) {
                html += `<button onclick="switchTab('customers')" id="tab-btn-customers" class="${activeTab === 'customers' ? activeClass : inactiveClass}"><i class="fa-solid fa-users"></i> Ledger</button>`;
            }
            if (userPermissions.statements) {
                html += `<button onclick="switchTab('statements')" id="tab-btn-statements" class="${activeTab === 'statements' ? activeClass : inactiveClass}"><i class="fa-solid fa-file-invoice-dollar"></i> Statements</button>`;
            }
            if (userPermissions.reports) {
                html += `<button onclick="switchTab('reports')" id="tab-btn-reports" class="${activeTab === 'reports' ? activeClass : inactiveClass}"><i class="fa-solid fa-chart-line"></i> Reports</button>`;
            }
            if (userRole === 'admin' || userPermissions.users) {
                html += `<button onclick="switchTab('users')" id="tab-btn-users" class="${activeTab === 'users' ? activeClass : inactiveClass}"><i class="fa-solid fa-user-gear"></i> User Panel</button>`;
            }

            nav.innerHTML = html;
        }

        async function loadCloudData() {
            try {
                const prodSnap = await db.collection('products').get();
                products = prodSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const custSnap = await db.collection('customers').get();
                customers = custSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const salesSnap = await db.collection('sales').orderBy('date', 'desc').get();
                sales = salesSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const userSnap = await db.collection('users').get();
                systemUsers = userSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                updateLowStockNotificationBadge();

                if (userPermissions.pos) renderPOS();
                else if (userPermissions.products) renderProducts();
                else if (userPermissions.statements) renderStatements();
                else if (userRole === 'admin') renderUsersTab();
            } catch (err) {
                console.error("Error loading data:", err);
                showToast("Error loading cloud data", "error");
            }
        }

        function updateLowStockNotificationBadge() {
            const lowStockItems = products.filter(p => p.stock <= 3);
            const badge = document.getElementById('low-stock-badge');
            const listContainer = document.getElementById('notification-list');
            
            if (!badge || !listContainer) return;

            if (lowStockItems.length > 0) {
                badge.innerText = lowStockItems.length;
                badge.classList.remove('hidden');
                
                listContainer.innerHTML = lowStockItems.map(p => `
                    <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-rose-500/20 hover:border-rose-500/50 transition">
                        <span class="font-medium text-slate-200 truncate pr-2">${p.name}</span>
                        <span class="bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-lg text-[11px] font-bold border border-rose-500/30 whitespace-nowrap">Stock: ${p.stock}</span>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                listContainer.innerHTML = '<div class="text-center text-slate-400 py-3 font-medium">✨ All stock levels are good!</div>';
            }
        }

        function toggleNotificationDropdown() {
            const dropdown = document.getElementById('notification-dropdown');
            if (dropdown) {
                dropdown.classList.toggle('hidden');
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-600 text-white shadow-emerald-600/30' : 'bg-rose-600 text-white shadow-rose-600/30';
            toast.className = `${colorClass} px-4 py-3 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2.5 border border-white/10 backdrop-blur-md`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-base' : 'fa-circle-exclamation text-base'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function switchTab(tab) {
            activeTab = tab;
            setupNavigation();

            if (tab === 'pos') renderPOS();
            else if (tab === 'products') renderProducts();
            else if (tab === 'customers') renderCustomers();
            else if (tab === 'statements') renderStatements();
            else if (tab === 'reports') renderReports();
            else if (tab === 'users') renderUsersTab();
        }

        // --- POS SECTION ---
        function renderPOS() {
            const container = document.getElementById('tab-content');
            let itemsHTML = products.map(p => `
                <div class="bg-slate-800/80 hover:bg-slate-800 p-4 rounded-2xl border ${p.stock <= 3 ? 'border-rose-500/50 shadow-rose-500/10' : 'border-slate-700/80'} hover:border-indigo-500/60 transition cursor-pointer flex flex-col justify-between shadow-lg group">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-sm text-slate-100 group-hover:text-indigo-300 transition">${p.name}</h3>
                            <span class="text-[11px] font-bold ${p.stock > 3 ? 'bg-slate-700/80 text-slate-300 border border-slate-600' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'} px-2 py-0.5 rounded-full whitespace-nowrap">Stock: ${p.stock}</span>
                        </div>
                        <p class="text-xs text-slate-400 font-medium mb-3">${p.category || 'General'}</p>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-700/60">
                        <span class="text-base font-extrabold text-emerald-400">Rs. ${p.price.toLocaleString()}</span>
                        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-md shadow-indigo-600/30 flex items-center gap-1.5 active:scale-95"><i class="fa-solid fa-plus text-[10px]"></i> Add</button>
                    </div>
                </div>
            `).join('');

            let cartHTML = currentCart.map((item, idx) => `
                <div class="flex items-center justify-between p-3 bg-slate-900/90 rounded-xl border border-slate-700/80 text-xs shadow-inner">
                    <div class="flex-1 pr-2">
                        <div class="font-semibold text-slate-200">${item.name} ${item.isCustom ? '<span class="text-[10px] text-amber-400 font-bold">(Custom)</span>' : ''}</div>
                        <div class="text-slate-400 mt-0.5">Rs. ${item.price} x ${item.qty} = <strong class="text-indigo-300">Rs. ${item.price * item.qty}</strong></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 overflow-hidden shadow-sm">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition">-</button>
                            <span class="w-7 text-center text-xs font-bold text-white">${item.qty}</span>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition">+</button>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg hover:bg-rose-500/10 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');

            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - currentDiscount);

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                    <!-- Left Product Catalog -->
                    <div class="lg:col-span-2 space-y-4">
                        <div class="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/80 shadow-lg">
                            <span class="text-xs font-semibold text-slate-300 flex items-center gap-2">
                                <img src="${LOGO_SRC}" class="w-5 h-5 rounded-lg object-cover border border-indigo-500/40" alt="Logo"> Active User: <strong class="text-indigo-300">(${currentUser.email})</strong>
                            </span>
                            <button onclick="openCustomItemModal()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-purple-600/30 flex items-center gap-1.5 active:scale-95">
                                <i class="fa-solid fa-screwdriver-wrench"></i> + Custom Item / Repair
                            </button>
                        </div>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" onkeyup="filterPOSProducts(this.value)" placeholder="Search products by name..." class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl pl-11 pr-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition shadow-inner">
                        </div>
                        <div id="pos-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${itemsHTML}</div>
                    </div>

                    <!-- Right Sticky Order Panel (Clean & Always Visible Print Button) -->
                    <div class="bg-slate-800/90 border border-slate-700/80 rounded-3xl p-5 sticky top-20 flex flex-col gap-4 shadow-2xl backdrop-blur-md">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-700/80">
                            <h2 class="font-extrabold text-base text-white tracking-wide">Current Order</h2>
                            <button onclick="clearCart()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold transition hover:underline">Clear All</button>
                        </div>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Select Customer</label>
                                <select id="cart-customer-select" onchange="onSelectCustomerChange(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs font-medium text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                                    <option value="">-- Direct / Walk-in Customer --</option>
                                    ${customers.map(c => {
                                        const cid = c.firebaseId || c.id;
                                        return `<option value="${cid}" ${selectedCustomerId === cid ? 'selected' : ''}>${c.name} (${c.phone || 'N/A'})</option>`;
                                    }).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Customer Name (ग्राहकको नाम)</label>
                                <input type="text" id="pos-customer-name" value="${manualCustomerName}" oninput="manualCustomerName = this.value" placeholder="Type customer name..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Address (ठेगाना)</label>
                                    <input type="text" id="pos-customer-address" value="${manualCustomerAddress}" oninput="manualCustomerAddress = this.value" placeholder="Damak" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Phone (फोन नम्बर)</label>
                                    <input type="text" id="pos-customer-phone" value="${manualCustomerPhone}" oninput="manualCustomerPhone = this.value" placeholder="9800000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                                </div>
                            </div>
                        </div>

                        <!-- Cart Items Scrollable List -->

        function addToCart(prodId) {
            const nameInput = document.getElementById('pos-customer-name');
            const addrInput = document.getElementById('pos-customer-address');
            const phoneInput = document.getElementById('pos-customer-phone');
            if (nameInput) manualCustomerName = nameInput.value;
            if (addrInput) manualCustomerAddress = addrInput.value;
            if (phoneInput) manualCustomerPhone = phoneInput.value;

            const product = products.find(p => String(p.id) === String(prodId));
            if (!product || product.stock <= 0) { showToast("Out of stock!", "error"); return; }
            const existing = currentCart.find(item => String(item.id) === String(prodId));
            if (existing) {
                if (existing.qty + 1 > product.stock) { showToast("Stock limit reached!", "error"); return; }
                existing.qty += 1;
            } else {
                currentCart.push({ id: product.id, name: product.name, price: product.price, qty: 1, isCustom: false });
            }
            renderPOS();
        }

        function updateCartQty(idx, change) {
            const nameInput = document.getElementById('pos-customer-name');
            const addrInput = document.getElementById('pos-customer-address');
            const phoneInput = document.getElementById('pos-customer-phone');
            if (nameInput) manualCustomerName = nameInput.value;
            if (addrInput) manualCustomerAddress = addrInput.value;
            if (phoneInput) manualCustomerPhone = phoneInput.value;

            const item = currentCart[idx];
            if (!item.isCustom) {
                const product = products.find(p => String(p.id) === String(item.id));
                const newQty = item.qty + change;
                if (newQty <= 0) { currentCart.splice(idx, 1); renderPOS(); return; }
                if (product && newQty > product.stock) { showToast("Stock limit reached!", "error"); return; }
                item.qty = newQty;
            } else {
                const newQty = item.qty + change;
                if (newQty <= 0) { currentCart.splice(idx, 1); renderPOS(); return; }
                item.qty = newQty;
            }
            renderPOS();
        }

        async function processCheckout() {
            if (currentCart.length === 0) { showToast("Cart is empty!", "error"); return; }
            
            const custSelectId = document.getElementById('cart-customer-select')?.value || selectedCustomerId;
            const inputName = document.getElementById('pos-customer-name')?.value.trim();
            const inputAddress = document.getElementById('pos-customer-address')?.value.trim();
            const inputPhone = document.getElementById('pos-customer-phone')?.value.trim();

            const selectedCustObj = customers.find(c => String(c.firebaseId) === String(custSelectId) || String(c.id) === String(custSelectId));
            
            const finalCustomerName = inputName || (selectedCustObj ? selectedCustObj.name : 'Walk-in Customer');
            const finalAddress = inputAddress || (selectedCustObj ? selectedCustObj.address : '');
            const finalPhone = inputPhone || (selectedCustObj ? selectedCustObj.phone : '');

            const paymentMethod = document.querySelector('input[name="payment-method"]:checked')?.value || 'Cash';
            
            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = Math.max(0, subtotal - currentDiscount);

            if (paymentMethod === 'Credit' && !custSelectId) {
                showToast("Please select an existing customer from dropdown for Credit sale!", "error");
                return;
            }

            const sale = {
                id: 'INV-' + Date.now().toString().slice(-6),
                date: new Date().toISOString(),
                teller: currentUser.email,
                customerName: finalCustomerName,
                customerAddress: finalAddress,
                customerPhone: finalPhone,
                customerId: custSelectId || null,
                items: [...currentCart],
                subtotal: subtotal,
                discount: currentDiscount,
                total: total,
                paymentMethod: paymentMethod,
                status: 'completed'
            };

            for (let cartItem of currentCart) {
                if (!cartItem.isCustom) {
                    const prod = products.find(p => String(p.id) === String(cartItem.id));
                    if (prod) {
                        prod.stock = Math.max(0, prod.stock - cartItem.qty);
                        if (prod.firebaseId) {
                            await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                        }
                    }
                }
            }

            if (paymentMethod === 'Credit' && custSelectId) {
                const cust = customers.find(c => String(c.firebaseId) === String(custSelectId) || String(c.id) === String(custSelectId));
                if (cust) {
                    cust.creditBalance = (cust.creditBalance || 0) + total;
                    if (cust.firebaseId) {
                        await db.collection('customers').doc(cust.firebaseId).update({ creditBalance: cust.creditBalance });
                    }
                }
            }

            const docRef = await db.collection('sales').add(sale);
            sales.unshift({ firebaseId: docRef.id, ...sale });

            showToast("Sale completed & recorded!");
            printSaleInvoice(sale);
            clearCart();
        }

        function exportStockExcel() {
            const data = products.map(p => ({ ID: p.id, Name: p.name, Category: p.category || 'General', Price: p.price, Stock: p.stock }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Inventory_Stock");
            XLSX.writeFile(workbook, "SBTECH_Inventory_Stock.xlsx");
            showToast("Stock exported to Excel successfully!");
        }

        async function importStockExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    let count = 0;
                    for (let row of json) {
                        const name = row.Name || row.name;
                        const price = parseFloat(row.Price || row.price || 0);
                        const stock = parseInt(row.Stock || row.stock || 0);
                        const category = row.Category || row.category || 'General';
                        const id = String(row.ID || row.id || (100 + products.length + 1));

                        if (!name) continue;

                        const existing = products.find(p => String(p.id) === String(id) || p.name.toLowerCase() === name.toLowerCase());
                        if (existing) {
                            existing.stock = stock;
                            existing.price = price;
                            if (existing.firebaseId) {
                                await db.collection('products').doc(existing.firebaseId).update({ stock, price });
                            }
                        } else {
                            const newProd = { id, name, price, stock, category };
                            const docRef = await db.collection('products').add(newProd);
                            products.push({ firebaseId: docRef.id, ...newProd });
                        }
                        count++;
                    }
                    renderProducts();
                    updateLowStockNotificationBadge();
                    showToast(`Successfully imported/updated ${count} products!`);
                } catch (err) {
                    console.error(err);
                    showToast("Failed to parse Excel file", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function saveReceivePayment(e, firebaseId, idx) {
            e.preventDefault();
            const customer = customers[idx];
            const amount = parseFloat(document.getElementById('pay-received-amount').value);
            const mode = document.getElementById('pay-received-mode').value;

            if (isNaN(amount) || amount <= 0) return;

            customer.creditBalance = Math.max(0, (customer.creditBalance || 0) - amount);

            if (firebaseId) {
                await db.collection('customers').doc(firebaseId).update({ creditBalance: customer.creditBalance });
            }

            const paymentRecord = {
                id: 'PAY-' + Date.now().toString().slice(-6),
                date: new Date().toISOString(),
                teller: currentUser.email,
                customerName: customer.name,
                customerAddress: customer.address || '',
                customerPhone: customer.phone || '',
                customerId: firebaseId,
                items: [{ name: 'Credit Settlement Payment Received', qty: 1, price: amount }],
                subtotal: amount,
                discount: 0,
                total: amount,
                paymentMethod: mode,
                status: 'completed',
                isPaymentReceipt: true
            };

            const docRef = await db.collection('sales').add(paymentRecord);
            sales.unshift({ firebaseId: docRef.id, ...paymentRecord });

            closeModal();
            renderCustomers();
            showToast(`Payment of Rs. ${amount.toLocaleString()} received & credit settled successfully!`);
        }

        async function cancelSaleTransaction(firebaseId, idx) {
            const sale = sales[idx];
            if (!sale) return;

            if (!confirm(`के तपाईं निश्चित हुनुहुन्छ? यो बिल (${sale.id}) क्यान्सिल गर्न चाहनुहुन्छ?`)) return;

            try {
                if (!sale.isPaymentReceipt) {
                    for (let item of sale.items) {
                        if (!item.isCustom) {
                            const prod = products.find(p => String(p.id) === String(item.id));
                            if (prod) {
                                prod.stock += item.qty;
                                if (prod.firebaseId) {
                                    await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                                }
                            }
                        }
                    }

                    if (sale.paymentMethod === 'Credit' && sale.customerId) {
                        const cust = customers.find(c => String(c.firebaseId) === String(sale.customerId) || String(c.id) === String(sale.customerId));
                        if (cust) {
                            cust.creditBalance = Math.max(0, (cust.creditBalance || 0) - sale.total);
                            if (cust.firebaseId) {
                                await db.collection('customers').doc(cust.firebaseId).update({ creditBalance: cust.creditBalance });
                            }
                        }
                    }
                } else {
                    if (sale.customerId) {
                        const cust = customers.find(c => String(c.firebaseId) === String(sale.customerId) || String(c.id) === String(sale.customerId));
                        if (cust) {
                            cust.creditBalance = (cust.creditBalance || 0) + sale.total;
                            if (cust.firebaseId) {
                                await db.collection('customers').doc(cust.firebaseId).update({ creditBalance: cust.creditBalance });
                            }
                        }
                    }
                }

                if (firebaseId) {
                    await db.collection('sales').doc(firebaseId).update({ status: 'cancelled' });
                }
                sale.status = 'cancelled';

                renderStatements();
                updateLowStockNotificationBadge();
                showToast(`Transaction ${sale.id} cancelled successfully!`);
            } catch (err) {
                console.error("Cancel Error:", err);
                showToast("Failed to cancel: " + err.message, "error");
            }
        }

        function getFilteredReportSales() {
            const fromDateVal = document.getElementById('rep-from-date')?.value;
            const toDateVal = document.getElementById('rep-to-date')?.value;
            const itemQuery = document.getElementById('rep-item-filter')?.value.toLowerCase().trim() || '';
            const clientQuery = document.getElementById('rep-client-filter')?.value.toLowerCase().trim() || '';

            const fromDate = fromDateVal ? new Date(fromDateVal + 'T00:00:00') : null;
            const toDate = toDateVal ? new Date(toDateVal + 'T23:59:59') : null;

            return sales.filter(s => {
                if (s.status === 'cancelled') return false;
                const saleDate = new Date(s.date);
                if (fromDate && saleDate < fromDate) return false;
                if (toDate && saleDate > toDate) return false;
                if (clientQuery && !s.customerName.toLowerCase().includes(clientQuery)) return false;
                if (itemQuery) {
                    const hasItem = s.items.some(i => i.name.toLowerCase().includes(itemQuery));
                    if (!hasItem) return false;
                }
                return true;
            });
        }

            const totalFonepayReceived = filteredSales.filter(s => s.paymentMethod === 'Fonepay').reduce((acc, s) => acc + s.total, 0);
            const totalCreditSales = filteredSales.filter(s => !s.isPaymentReceipt && s.paymentMethod === 'Credit').reduce((acc, s) => acc + s.total, 0);

            document.getElementById('report-summary-cards').innerHTML = `

        function exportReportExcel() {
            const filteredSales = getFilteredReportSales();
            const data = filteredSales.map(s => ({
                Invoice: s.id, Date: new Date(s.date).toLocaleString(), ClientName: s.customerName, Phone: s.customerPhone || 'N/A', Address: s.customerAddress || 'N/A', Details: s.items.map(i => i.name).join(', '), PaymentMode: s.paymentMethod || 'Cash', Amount: s.total
            }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Sales_Report");
            XLSX.writeFile(workbook, "SBTECH_Sales_Report.xlsx");
            showToast("Report exported to Excel successfully!");
        }

                statements: document.getElementById('perm-statements').checked,

            try {

            const newPass = document.getElementById('my-new-password').value.trim();
            if (!newPass || newPass.length < 6) {
                showToast("Password must be at least 6 characters!", "error");
                return;
            }

            try {
                await currentUser.updatePassword(newPass);
                closeModal();
                showToast("Password updated in system! Please login again with your new password.");
                setTimeout(() => logout(), 1500);
            } catch (err) {
                if (err.code === 'auth/requires-recent-login') {
                    showToast("Security Check: Please logout and login again before changing password.", "error");
                } else {
                    showToast("Password update failed: " + err.message, "error", "error");
                }
            }
        }

        async function toggleUserStatus(firebaseId, idx) {
            const u = systemUsers[idx];
            if (!u) return;
            const newDisabledState = !u.disabled;

            if (firebaseId) {
                await db.collection('users').doc(firebaseId).update({ disabled: newDisabledState });
            }
            u.disabled = newDisabledState;
            renderUsersTab();
            showToast(`User ${newDisabledState ? 'disabled' : 'enabled'} successfully!`);
        }

        async function deleteUser(firebaseId, idx) {
            if (!confirm("Are you sure you want to delete this user permanently?")) return;
            if (firebaseId) {
                await db.collection('users').doc(firebaseId).delete();
            }
            systemUsers.splice(idx, 1);
            renderUsersTab();
            showToast("User deleted permanently!", "error");
        }

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
    </script>
</body>
</html>
