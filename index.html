<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB TECH - Cloud Billing & Stock Management</title>
    
    <!-- Static Compiled Tailwind CSS (CSP Safe) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase App, Auth & Firestore SDK (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app-container" class="flex-1 flex flex-col">
        <!-- Auth Screen -->
        <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
            <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <img id="app-logo-login" src="logo.jpeg" class="w-20 h-20 mx-auto rounded-full mb-3 shadow-lg object-cover border-2 border-blue-500" alt="SB TECH Logo" onerror="this.style.display='none'">
                    <h1 class="font-extrabold text-xl text-white">SB TECH Cloud Login</h1>
                    <p class="text-xs text-gray-400 mt-1">Complete IT Support & Service</p>
                </div>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="login-email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500" placeholder="admin@sbtech.com.np">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs text-gray-400">Password</label>
                            <button type="button" onclick="sendForgotPasswordReset()" class="text-xs text-blue-400 hover:underline">Forgot Password?</button>
                        </div>
                        <input type="password" id="login-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold text-white rounded-xl shadow-lg transition">Login to System</button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="main-dashboard" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
                <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <img id="app-logo-header" src="logo.jpeg" class="w-10 h-10 rounded-full object-cover shadow-md border border-blue-500" alt="SB TECH Logo" onerror="this.style.display='none'">
                        <div>
                            <h1 class="font-extrabold text-sm text-white tracking-wide flex items-center gap-2">
                                SB TECH <span id="role-badge" class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded-full"></span>
                            </h1>
                            <p class="text-xs text-gray-400">Damak-5, Jhapa, Nepal | VAT: 600714930</p>
                        </div>
                    </div>

                    <nav id="nav-tabs" class="flex items-center gap-1 bg-gray-900 p-1 rounded-xl border border-gray-700">
                        <!-- Dynamically rendered -->
                    </nav>

                    <div class="flex items-center gap-3">
                        <span id="user-email-display" class="text-xs text-gray-300 hidden sm:inline"></span>
                        <button onclick="openChangeMyPasswordModal()" class="px-2.5 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-semibold rounded-lg transition border border-gray-600 flex items-center gap-1">
                            <i class="fa-solid fa-key"></i> Change Password
                        </button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold rounded-lg transition border border-red-500/30">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="tab-content">
                <!-- Content injected here -->
            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>
    <div id="modal-container"></div>

    <script>
        const LOGO_SRC = "logo.jpeg";

        const firebaseConfig = {
            apiKey: "AIzaSyDmvvmLLbDR7RLUDpIz2y3dsu9zXORdlr8",
            authDomain: "sbtech-billing.firebaseapp.com",
            projectId: "sbtech-billing",
            storageBucket: "sbtech-billing.firebasestorage.app",
            messagingSenderId: "330652833543",
            appId: "1:330652833543:web:5adff75f4288b85f6e97a2",
            measurementId: "G-C7P9R3KGLB"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userRole = 'teller';
        let userPermissions = { pos: true, products: false, customers: false, statements: false, reports: false, users: false };
        let products = [];
        let customers = [];
        let sales = [];
        let systemUsers = [];
        let currentCart = [];
        let currentDiscount = 0;
        let activeTab = 'pos';

        auth.onAuthStateChanged(async function(user) {
            if (user) {
                const isAllowed = await fetchUserPermissions(user.email);
                if (!isAllowed) {
                    showToast("Access Denied: Unregistered or Disabled User!", "error");
                    auth.signOut();
                    return;
                }

                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('role-badge').innerText = userRole.toUpperCase();
                
                setupNavigation();
                await loadCloudData();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.add('hidden');
            }
        });

        async function fetchUserPermissions(email) {
            try {
                if (email === 'admin@sbtech.com.np') {
                    userRole = 'admin';
                    userPermissions = { pos: true, products: true, customers: true, statements: true, reports: true, users: true };
                    return true;
                }

                const snap = await db.collection('users').where('email', '==', email).get();
                if (!snap.empty) {
                    const data = snap.docs[0].data();
                    if (data.disabled === true) return false;

                    userRole = data.role || 'teller';
                    userPermissions = data.permissions || { pos: true, products: false, customers: false, statements: false, reports: false, users: false };
                    return true;
                } else {
                    return false;
                }
            } catch (e) {
                console.error("Error fetching permissions:", e);
                return false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            
            try {
                if (email !== 'admin@sbtech.com.np') {
                    const checkUser = await db.collection('users').where('email', '==', email).get();
                    if (checkUser.empty) {
                        showToast("Login Failed: User not created by Admin!", "error");
                        return;
                    }
                    const uData = checkUser.docs[0].data();
                    if (uData.disabled === true) {
                        showToast("Account Disabled! Contact Admin.", "error");
                        return;
                    }
                }

                await auth.signInWithEmailAndPassword(email, pass);
                showToast("Login Successful!");
            } catch (err) {
                showToast("Invalid Email or Password!", "error");
            }
        }

        async function sendForgotPasswordReset() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showToast("Please enter your Email Address first!", "error");
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showToast("Password reset link sent to your email (" + email + ")");
            } catch (err) {
                showToast("Reset Failed: " + err.message, "error");
            }
        }

        function logout() {
            auth.signOut();
            showToast("Logged out successfully");
        }

        function setupNavigation() {
            const nav = document.getElementById('nav-tabs');
            let html = '';

            if (userPermissions.pos) {
                html += `<button onclick="switchTab('pos')" id="tab-btn-pos" class="px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 bg-blue-600 text-white shadow-md"><i class="fa-solid fa-cart-shopping"></i> POS</button>`;
            }
            if (userPermissions.products) {
                html += `<button onclick="switchTab('products')" id="tab-btn-products" class="px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5"><i class="fa-solid fa-boxes-stacked"></i> Stock</button>`;
            }
            if (userPermissions.customers) {
                html += `<button onclick="switchTab('customers')" id="tab-btn-customers" class="px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5"><i class="fa-solid fa-users"></i> Ledger</button>`;
            }
            if (userPermissions.statements) {
                html += `<button onclick="switchTab('statements')" id="tab-btn-statements" class="px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5"><i class="fa-solid fa-file-invoice-dollar"></i> Statements</button>`;
            }
            if (userPermissions.reports) {
                html += `<button onclick="switchTab('reports')" id="tab-btn-reports" class="px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5"><i class="fa-solid fa-chart-line"></i> Reports</button>`;
            }
            if (userRole === 'admin' || userPermissions.users) {
                html += `<button onclick="switchTab('users')" id="tab-btn-users" class="px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5"><i class="fa-solid fa-user-gear"></i> User Panel</button>`;
            }

            nav.innerHTML = html;
            
            const allowedTabs = ['pos', 'products', 'customers', 'statements', 'reports', 'users'];
            const firstValid = allowedTabs.find(t => t === 'pos' ? userPermissions.pos : (t === 'products' ? userPermissions.products : (t === 'customers' ? userPermissions.customers : (t === 'statements' ? userPermissions.statements : (t === 'reports' ? userPermissions.reports : (userRole === 'admin' || userPermissions.users))))));
            
            if (firstValid) switchTab(firstValid);
        }

        async function loadCloudData() {
            try {
                const prodSnap = await db.collection('products').get();
                products = prodSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const custSnap = await db.collection('customers').get();
                customers = custSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const salesSnap = await db.collection('sales').orderBy('date', 'desc').get();
                sales = salesSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                const userSnap = await db.collection('users').get();
                systemUsers = userSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                if (userPermissions.pos) renderPOS();
                else if (userPermissions.products) renderProducts();
                else if (userPermissions.statements) renderStatements();
                else if (userRole === 'admin') renderUsersTab();
            } catch (err) {
                console.error("Error loading data:", err);
                showToast("Error loading cloud data", "error");
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white';
            toast.className = `${colorClass} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "px-3 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-1.5";
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) {
                activeBtn.className = "px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 bg-blue-600 text-white shadow-md";
            }

            if (tab === 'pos') renderPOS();
            else if (tab === 'products') renderProducts();
            else if (tab === 'customers') renderCustomers();
            else if (tab === 'statements') renderStatements();
            else if (tab === 'reports') renderReports();
            else if (tab === 'users') renderUsersTab();
        }

        function getLowStockBannerHTML() {
            const lowStockItems = products.filter(p => p.stock <= 3);
            if (lowStockItems.length === 0) return '';
            const names = lowStockItems.map(p => `<span class="font-bold underline">${p.name} (${p.stock})</span>`).join(', ');
            return `
                <div class="bg-red-900/60 border border-red-500 text-red-200 px-4 py-3 rounded-xl mb-4 flex items-center gap-3 text-xs shadow-lg animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation text-lg text-red-400"></i>
                    <div>
                        <strong class="font-bold text-white">Low Stock Warning! </strong> 
                        निम्न सामानहरूको स्टक सकिन लागेको छ: ${names}
                    </div>
                </div>
            `;
        }

        // --- POS SECTION ---
        function renderPOS() {
            const container = document.getElementById('tab-content');
            let itemsHTML = products.map(p => `
                <div class="bg-gray-800 p-4 rounded-xl border ${p.stock <= 3 ? 'border-red-500/80' : 'border-gray-700'} hover:border-blue-500 transition cursor-pointer flex flex-col justify-between" onclick="addToCart('${p.id}')">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-100">${p.name}</h3>
                            <span class="text-xs ${p.stock > 3 ? 'bg-gray-700 text-gray-300' : 'bg-red-900 text-red-300 font-bold'} px-2 py-0.5 rounded-full">Stock: ${p.stock}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-2">Category: ${p.category || 'General'}</p>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-700">
                        <span class="text-lg font-bold text-green-400">Rs. ${p.price.toLocaleString()}</span>
                        <button class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-medium transition"><i class="fa-solid fa-plus"></i> Add</button>
                    </div>
                </div>
            `).join('');

            let cartHTML = currentCart.map((item, idx) => `
                <div class="flex items-center justify-between p-3 bg-gray-900 rounded-lg border border-gray-700 text-sm">
                    <div class="flex-1">
                        <div class="font-medium text-gray-200">${item.name}</div>
                        <div class="text-xs text-gray-400">Rs. ${item.price} x ${item.qty} = Rs. ${item.price * item.qty}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-gray-800 rounded-lg border border-gray-700">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-7 h-7 flex items-center justify-center text-gray-300">-</button>
                            <span class="w-8 text-center text-xs font-semibold">${item.qty}</span>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-7 h-7 flex items-center justify-center text-gray-300">+</button>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');

            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - currentDiscount);

            container.innerHTML = `
                <div class="space-y-4">
                    ${getLowStockBannerHTML()}
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 space-y-4">
                            <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl border border-gray-700">
                                <span class="text-xs font-semibold text-blue-400 flex items-center gap-2">
                                    <img src="${LOGO_SRC}" class="w-5 h-5 rounded-full object-cover" alt="Logo"> Active User: (${currentUser.email})
                                </span>
                                <span class="text-xs text-gray-400">Products available: ${products.length}</span>
                            </div>
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" onkeyup="filterPOSProducts(this.value)" placeholder="Search products..." class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-gray-100 text-sm">
                            </div>
                            <div id="pos-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${itemsHTML}</div>
                        </div>

                        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col justify-between h-[calc(100vh-160px)] sticky top-20">
                            <div>
                                <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-700">
                                    <h2 class="font-bold text-lg text-gray-100">Current Order</h2>
                                    <button onclick="clearCart()" class="text-xs text-red-400">Clear</button>
                                </div>
                                <div class="space-y-2 mb-3">
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Select Existing Customer</label>
                                        <select id="cart-customer-select" onchange="onSelectCustomerChange(this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-200">
                                            <option value="">-- Direct / Walk-in Customer --</option>
                                            ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || 'N/A'})</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Customer Name (ग्राहकको नाम)</label>
                                        <input type="text" id="pos-customer-name" placeholder="Type customer name..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-xs text-gray-400 mb-1">Address (ठेगाना)</label>
                                            <input type="text" id="pos-customer-address" placeholder="Damak" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                        </div>
                                        <div>
                                            <label class="block text-xs text-gray-400 mb-1">Phone (फोन नम्बर)</label>
                                            <input type="text" id="pos-customer-phone" placeholder="9800000000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-2 max-h-[100px] overflow-y-auto pr-1 border-t border-gray-700/50 pt-2">
                                    ${currentCart.length === 0 ? '<div class="text-center py-4 text-gray-500 text-sm">Cart is empty</div>' : cartHTML}
                                </div>
                            </div>

                            <div class="pt-3 border-t border-gray-700 space-y-2">
                                <div class="flex justify-between items-center text-xs text-gray-300">
                                    <span>Subtotal:</span>
                                    <span>Rs. ${subtotal.toLocaleString()}</span>
                                </div>
                                
                                <div class="flex justify-between items-center text-xs text-yellow-400">
                                    <label class="font-medium">Discount (Rs.):</label>
                                    <input type="number" id="pos-discount-input" value="${currentDiscount}" min="0" oninput="updateDiscount(this.value)" class="w-24 bg-gray-900 border border-yellow-500/50 rounded p-1 text-right text-xs text-yellow-300 font-bold focus:outline-none">
                                </div>

                                <div class="flex justify-between text-lg font-bold border-t border-gray-700 pt-1">
                                    <span class="text-gray-300">Grand Total:</span>
                                    <span class="text-green-400">Rs. ${grandTotal.toLocaleString()}</span>
                                </div>

                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <label class="flex items-center justify-center gap-2 p-2 rounded-lg border border-gray-700 bg-gray-900 text-xs text-gray-200 cursor-pointer">
                                        <input type="radio" name="payment-method" value="Cash" checked> Cash
                                    </label>
                                    <label class="flex items-center justify-center gap-2 p-2 rounded-lg border border-gray-700 bg-gray-900 text-xs text-gray-200 cursor-pointer">
                                        <input type="radio" name="payment-method" value="Fonepay"> Fonepay
                                    </label>
                                </div>
                                <button onclick="processCheckout()" class="w-full py-3 bg-green-600 hover:bg-green-500 font-semibold text-white rounded-xl shadow-lg flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-print"></i> Complete Sale & Print
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateDiscount(val) {
            currentDiscount = parseFloat(val) || 0;
            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - currentDiscount);
            const gtDisplay = document.querySelector('.text-green-400');
            if (gtDisplay) gtDisplay.innerText = `Rs. ${grandTotal.toLocaleString()}`;
        }

        function onSelectCustomerChange(custId) {
            if (!custId) {
                document.getElementById('pos-customer-name').value = '';
                document.getElementById('pos-customer-address').value = '';
                document.getElementById('pos-customer-phone').value = '';
                return;
            }
            const c = customers.find(cust => cust.id === custId);
            if (c) {
                document.getElementById('pos-customer-name').value = c.name || '';
                document.getElementById('pos-customer-address').value = c.address || '';
                document.getElementById('pos-customer-phone').value = c.phone || '';
            }
        }

        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product || product.stock <= 0) { showToast("Out of stock!", "error"); return; }
            const existing = currentCart.find(item => item.id === prodId);
            if (existing) {
                if (existing.qty + 1 > product.stock) { showToast("Stock limit reached!", "error"); return; }
                existing.qty += 1;
            } else {
                currentCart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            renderPOS();
        }

        function updateCartQty(idx, change) {
            const item = currentCart[idx];
            const product = products.find(p => p.id === item.id);
            const newQty = item.qty + change;

        async function processCheckout() {
            if (currentCart.length === 0) { showToast("Cart is empty!", "error"); return; }
            
            const custSelectId = document.getElementById('cart-customer-select').value;
            const inputName = document.getElementById('pos-customer-name').value.trim();
            const inputAddress = document.getElementById('pos-customer-address').value.trim();
            const inputPhone = document.getElementById('pos-customer-phone').value.trim();

            const finalCustomerName = inputName || 'Walk-in Customer';
            const paymentMethod = document.querySelector('input[name="payment-method"]:checked')?.value || 'Cash';
            
            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = Math.max(0, subtotal - currentDiscount);

            const sale = {
                id: 'INV-' + Date.now().toString().slice(-6),
                date: new Date().toISOString(),
                teller: currentUser.email,
                customerName: finalCustomerName,
                customerAddress: inputAddress,
                customerPhone: inputPhone,
                customerId: custSelectId || null,
                items: [...currentCart],
                subtotal: subtotal,
                discount: currentDiscount,
                total: total,
                paymentMethod: paymentMethod,
                status: 'completed'
            };

            for (let cartItem of currentCart) {
                const prod = products.find(p => p.id === cartItem.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - cartItem.qty);
                    if (prod.firebaseId) {
                        await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                    }
                }
            }

            const docRef = await db.collection('sales').add(sale);
            sales.unshift({ firebaseId: docRef.id, ...sale });

            showToast("Sale completed & recorded!");
            printSaleInvoice(sale);
            clearCart();
        }

        function exportStockExcel() {
            const data = products.map(p => ({ ID: p.id, Name: p.name, Category: p.category || 'General', Price: p.price, Stock: p.stock }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Inventory_Stock");
            XLSX.writeFile(workbook, "SBTECH_Inventory_Stock.xlsx");
            showToast("Stock exported to Excel successfully!");
        }

        async function importStockExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    let count = 0;
                    for (let row of json) {
                        const name = row.Name || row.name;
                        const price = parseFloat(row.Price || row.price || 0);
                        const stock = parseInt(row.Stock || row.stock || 0);
                        const category = row.Category || row.category || 'General';
                        const id = String(row.ID || row.id || (100 + products.length + 1));

                        if (!name) continue;

                        const existing = products.find(p => p.id === id || p.name.toLowerCase() === name.toLowerCase());
                        if (existing) {
                            existing.stock = stock;
                            existing.price = price;
                            if (existing.firebaseId) {
                                await db.collection('products').doc(existing.firebaseId).update({ stock, price });
                            }
                        } else {
                            const newProd = { id, name, price, stock, category };
                            const docRef = await db.collection('products').add(newProd);
                            products.push({ firebaseId: docRef.id, ...newProd });
                        }
                        count++;
                    }
                    renderProducts();
                    showToast(`Successfully imported/updated ${count} products!`);
                } catch (err) {
                    console.error(err);
                    showToast("Failed to parse Excel file", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function cancelSaleTransaction(firebaseId, idx) {
            const sale = sales[idx];
            if (!sale) return;

            if (!confirm(`के तपाईं निश्चित हुनुहुन्छ? यो बिल (${sale.id}) क्यान्सिल गर्दा सामानहरूको स्टक (Stock) स्वतः फिर्ता हुनेछ।`)) return;

            try {
                for (let item of sale.items) {
                    const prod = products.find(p => p.id === item.id);
                    if (prod) {
                        prod.stock += item.qty;
                        if (prod.firebaseId) {
                            await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                        }
                    }
                }

                if (firebaseId) {
                    await db.collection('sales').doc(firebaseId).update({ status: 'cancelled' });
                }
                sale.status = 'cancelled';

                renderStatements();
                showToast(`Sale ${sale.id} cancelled & stock restored successfully!`);
            } catch (err) {
                console.error("Cancel Sale Error:", err);
                showToast("Failed to cancel sale: " + err.message, "error");
            }
        }

        function getFilteredReportSales() {
            const fromDateVal = document.getElementById('rep-from-date')?.value;
            const toDateVal = document.getElementById('rep-to-date')?.value;
            const itemQuery = document.getElementById('rep-item-filter')?.value.toLowerCase().trim() || '';
            const clientQuery = document.getElementById('rep-client-filter')?.value.toLowerCase().trim() || '';

            const fromDate = fromDateVal ? new Date(fromDateVal + 'T00:00:00') : null;
            const toDate = toDateVal ? new Date(toDateVal + 'T23:59:59') : null;

            return sales.filter(s => {
                if (s.status === 'cancelled') return false;
                const saleDate = new Date(s.date);
                if (fromDate && saleDate < fromDate) return false;
                if (toDate && saleDate > toDate) return false;
                if (clientQuery && !s.customerName.toLowerCase().includes(clientQuery)) return false;
                if (itemQuery) {
                    const hasItem = s.items.some(i => i.name.toLowerCase().includes(itemQuery));
                    if (!hasItem) return false;
                }
                return true;
            });
        }

                                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" id="edit-perm-pos" ${p.pos ? 'checked' : ''}> POS & Billing</label>
                                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" id="edit-perm-products" ${p.products ? 'checked' : ''}> Stock & Inventory</label>
                                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" id="edit-perm-customers" ${p.customers ? 'checked' : ''}> Credit Ledger</label>
                                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" id="edit-perm-statements" ${p.statements ? 'checked' : ''}> Statements</label>
                                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" id="edit-perm-reports" ${p.reports ? 'checked' : ''}> Reports</label>
                            </div>
                            <div class="flex gap-2 pt-3">
                                <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 py-2.5 rounded-lg text-sm">Cancel</button>
                                <button type="submit" class="flex-1 bg-blue-600 py-2.5 rounded-lg text-sm font-semibold">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveUserPermissions(e, firebaseId, idx) {
            e.preventDefault();
            const permissions = {
                pos: document.getElementById('edit-perm-pos').checked,
                products: document.getElementById('edit-perm-products').checked,
                customers: document.getElementById('edit-perm-customers').checked,
                statements: document.getElementById('edit-perm-statements').checked,
                reports: document.getElementById('edit-perm-reports').checked
            };

            if (firebaseId) {
                await db.collection('users').doc(firebaseId).update({ permissions });
            }

            systemUsers[idx].permissions = permissions;
            closeModal();
            renderUsersTab();
            showToast("Permissions updated successfully!");
        }

        async function sendPasswordResetEmail(email) {
            try {
                await auth.sendPasswordResetEmail(email);
                showToast("Password Reset Link sent to " + email);
            } catch (err) {
                showToast("Error: " + err.message, "error");
            }
        }

        function openChangeMyPasswordModal() {
            document.getElementById('modal-container').innerHTML = `
                <div class="bg-gray-900/80 fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 text-gray-100">
                        <h2 class="font-bold text-lg mb-1">Change Account Password</h2>
                        <p class="text-xs text-gray-400 mb-4">Direct password update for: <strong class="text-white">${currentUser.email}</strong></p>
                        <form onsubmit="handleSelfPasswordChange(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">New Password (नयाँ पासवर्ड)</label>
                                <input type="password" id="my-new-password" required minlength="6" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white" placeholder="Minimum 6 characters">
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 py-2.5 rounded-lg text-sm">Cancel</button>
                                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg text-sm font-semibold">Update Password Now</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleSelfPasswordChange(e) {
            e.preventDefault();
            const newPass = document.getElementById('my-new-password').value.trim();
            if (!newPass || newPass.length < 6) {
                showToast("Password must be at least 6 characters!", "error");
                return;
            }

            try {
                await currentUser.updatePassword(newPass);
                closeModal();
                showToast("Password updated in system! Please login again with your new password.");
                setTimeout(() => logout(), 1500);
            } catch (err) {
                if (err.code === 'auth/requires-recent-login') {
                    showToast("Security Check: Please logout and login again before changing password.", "error");
                } else {
                    showToast("Password update failed: " + err.message, "error");
                }
            }
        }

        async function toggleUserStatus(firebaseId, idx) {
            const u = systemUsers[idx];
            if (!u) return;
            const newDisabledState = !u.disabled;

            if (firebaseId) {
                await db.collection('users').doc(firebaseId).update({ disabled: newDisabledState });
            }
            u.disabled = newDisabledState;
            renderUsersTab();
            showToast(`User ${newDisabledState ? 'disabled' : 'enabled'} successfully!`);
        }

        async function deleteUser(firebaseId, idx) {
            if (!confirm("Are you sure you want to delete this user permanently?")) return;
            if (firebaseId) {
                await db.collection('users').doc(firebaseId).delete();
            }
            systemUsers.splice(idx, 1);
            renderUsersTab();
            showToast("User deleted permanently!", "error");
        }

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
    </script>
</body>
</html>
