<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB TECH - Cloud Billing & Stock Management</title>
    
    <!-- Static Compiled Tailwind CSS (CSP Safe) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase App, Auth & Firestore SDK (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app-container" class="flex-1 flex flex-col">
        <!-- Auth Screen / Loading -->
        <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
            <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <img id="app-logo-login" src="logo.jpeg" class="w-20 h-20 mx-auto rounded-full mb-3 shadow-lg object-cover border-2 border-blue-500" alt="SB TECH Logo" onerror="this.style.display='none'">
                    <h1 class="font-extrabold text-xl text-white">SB TECH Cloud Login</h1>
                    <p class="text-xs text-gray-400 mt-1">Complete IT Support & Service</p>
                </div>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="login-email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500" placeholder="admin@sbtech.com.np">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Password</label>
                        <input type="password" id="login-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold text-white rounded-xl shadow-lg transition">Login to System</button>
                </form>
                <div class="mt-6 pt-4 border-t border-gray-700 text-center text-xs text-gray-400">
                    <p class="font-semibold text-gray-300 mb-1">Default Logins:</p>
                    <p>Admin: admin@sbtech.com.np / admin123</p>
                    <p>Accountant: account@sbtech.com.np / account123</p>
                    <p>Teller: teller@sbtech.com.np / teller123</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard (Hidden until login) -->
        <div id="main-dashboard" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
                <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <img id="app-logo-header" src="logo.jpeg" class="w-10 h-10 rounded-full object-cover shadow-md border border-blue-500" alt="SB TECH Logo" onerror="this.style.display='none'">
                        <div>
                            <h1 class="font-extrabold text-sm text-white tracking-wide flex items-center gap-2">
                                SB TECH <span id="role-badge" class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded-full"></span>
                            </h1>
                            <p class="text-xs text-gray-400">Damak-5, Jhapa, Nepal | VAT: 600714930</p>
                        </div>
                    </div>

                    <nav id="nav-tabs" class="flex items-center gap-1 bg-gray-900 p-1 rounded-xl border border-gray-700">
                        <!-- Dynamically rendered based on role -->
                    </nav>

                    <div class="flex items-center gap-3">
                        <span id="user-email-display" class="text-xs text-gray-300 hidden sm:inline"></span>
                        <button onclick="logout()" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold rounded-lg transition border border-red-500/30">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="tab-content">
                <!-- Content injected here -->
            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>
    <div id="modal-container"></div>

    <script>
        const LOGO_SRC = "logo.jpeg";

        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDmvvmLLbDR7RLUDpIz2y3dsu9zXORdlr8",
            authDomain: "sbtech-billing.firebaseapp.com",
            projectId: "sbtech-billing",
            storageBucket: "sbtech-billing.firebasestorage.app",
            messagingSenderId: "330652833543",
            appId: "1:330652833543:web:5adff75f4288b85f6e97a2",
            measurementId: "G-C7P9R3KGLB"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userRole = 'teller';
        let products = [];
        let customers = [];
        let sales = [];
        let currentCart = [];
        let activeTab = 'pos';

        auth.onAuthStateChanged(async function(user) {
            if (user) {
                currentUser = user;
                await fetchUserRole(user.email);
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('role-badge').innerText = userRole.toUpperCase();
                
                setupNavigation();
                await loadCloudData();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.add('hidden');
            }
        });

        async function fetchUserRole(email) {
            try {
                const snap = await db.collection('users').where('email', '==', email).get();
                if (!snap.empty) {
                    userRole = snap.docs[0].data().role || 'teller';
                } else {
                    await seedDefaultUsers();
                    const retrySnap = await db.collection('users').where('email', '==', email).get();
                    if (!retrySnap.empty) {
                        userRole = retrySnap.docs[0].data().role || 'teller';
                    } else {
                        userRole = email.includes('admin') ? 'admin' : (email.includes('account') ? 'accountant' : 'teller');
                    }
                }
            } catch (e) {
                console.error("Error fetching role:", e);
                userRole = 'admin';
            }
        }

        async function seedDefaultUsers() {
            const defaultUsers = [
                { email: 'admin@sbtech.com.np', role: 'admin', name: 'Administrator' },
                { email: 'account@sbtech.com.np', role: 'accountant', name: 'Accountant' },
                { email: 'teller@sbtech.com.np', role: 'teller', name: 'Billing Teller' }
            ];
            for (let u of defaultUsers) {
                const exist = await db.collection('users').where('email', '==', u.email).get();
                if (exist.empty) {
                    await db.collection('users').add(u);
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                showToast("Login Successful!");
            } catch (err) {
                try {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    showToast("Account created & logged in!");
                } catch (createErr) {
                    showToast("Login failed: " + err.message, "error");
                }
            }
        }

        function logout() {
            auth.signOut();
            showToast("Logged out successfully");
        }

        function setupNavigation() {
            const nav = document.getElementById('nav-tabs');
            let html = '';

            if (userRole === 'admin' || userRole === 'teller') {
                html += `<button onclick="switchTab('pos')" id="tab-btn-pos" class="px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-blue-600 text-white shadow-md"><i class="fa-solid fa-cart-shopping"></i> POS & Billing</button>`;
            }
            if (userRole === 'admin') {
                html += `<button onclick="switchTab('products')" id="tab-btn-products" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-2"><i class="fa-solid fa-boxes-stacked"></i> Inventory & Stock Adjust</button>`;
            }
            if (userRole === 'admin' || userRole === 'accountant') {
                html += `<button onclick="switchTab('customers')" id="tab-btn-customers" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-2"><i class="fa-solid fa-users"></i> Credit Ledger</button>`;
                html += `<button onclick="switchTab('statements')" id="tab-btn-statements" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-2"><i class="fa-solid fa-file-invoice-dollar"></i> Statements & Returns</button>`;
                html += `<button onclick="switchTab('reports')" id="tab-btn-reports" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-2"><i class="fa-solid fa-chart-line"></i> Reports</button>`;
            }

            nav.innerHTML = html;
            if (userRole === 'accountant') switchTab('statements');
            else switchTab('pos');
        }

        async function loadCloudData() {
            try {
                const prodSnap = await db.collection('products').get();
                if (!prodSnap.empty) {
                    products = prodSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));
                } else {
                    products = [
                        { id: '101', name: 'Dell Vostro Laptop 15', price: 68000, stock: 8, category: 'Laptops' },
                        { id: '102', name: 'HP LaserJet Printer M108a', price: 21500, stock: 5, category: 'Printers' },
                        { id: '103', name: 'Hikvision 2MP Outdoor CCTV', price: 3400, stock: 20, category: 'CCTV' },
                        { id: '104', name: 'TP-Link Dual Band Router C6', price: 3800, stock: 12, category: 'Routers' },
                        { id: '105', name: 'Cat6 Network Cable Box', price: 8500, stock: 4, category: 'Networking' }
                    ];
                    for (let p of products) await db.collection('products').add(p);
                }

                const custSnap = await db.collection('customers').get();
                if (!custSnap.empty) {
                    customers = custSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));
                } else {
                    customers = [
                        { id: 'c1', name: 'Ram Bahadur', phone: '9801234567', address: 'Damak-5, Jhapa', creditBalance: 4500 },
                        { id: 'c2', name: 'Sita Sharma', phone: '9842345678', address: 'Damak-3, Jhapa', creditBalance: 0 }
                    ];
                    for (let c of customers) await db.collection('customers').add(c);
                }

                const salesSnap = await db.collection('sales').orderBy('date', 'desc').get();
                sales = salesSnap.docs.map(doc => Object.assign({ firebaseId: doc.id }, doc.data()));

                if (userRole === 'accountant') switchTab('statements');
                else renderPOS();
            } catch (err) {
                console.error("Error loading data:", err);
                showToast("Error loading cloud data", "error");
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white';
            toast.className = `${colorClass} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-white hover:bg-gray-800 transition flex items-center gap-2";
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) {
                activeBtn.className = "px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-blue-600 text-white shadow-md";
            }

            if (tab === 'pos') renderPOS();
            else if (tab === 'products') renderProducts();
            else if (tab === 'customers') renderCustomers();
            else if (tab === 'statements') renderStatements();
            else if (tab === 'reports') renderReports();
        }

        // --- POS & TELLER ENTRY ---
        function renderPOS() {
            const container = document.getElementById('tab-content');
            let itemsHTML = products.map(p => `
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer flex flex-col justify-between" onclick="addToCart('${p.id}')">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-100">${p.name}</h3>
                            <span class="text-xs ${p.stock > 0 ? 'bg-gray-700 text-gray-300' : 'bg-red-900 text-red-300'} px-2 py-0.5 rounded-full">Stock: ${p.stock}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-2">Category: ${p.category || 'General'}</p>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-700">
                        <span class="text-lg font-bold text-green-400">Rs. ${p.price.toLocaleString()}</span>
                        <button class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-medium transition"><i class="fa-solid fa-plus"></i> Add</button>
                    </div>
                </div>
            `).join('');

            let cartHTML = currentCart.map((item, idx) => `
                <div class="flex items-center justify-between p-3 bg-gray-900 rounded-lg border border-gray-700 text-sm">
                    <div class="flex-1">
                        <div class="font-medium text-gray-200">${item.name}</div>
                        <div class="text-xs text-gray-400">Rs. ${item.price} x ${item.qty} = Rs. ${item.price * item.qty}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-gray-800 rounded-lg border border-gray-700">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-7 h-7 flex items-center justify-center text-gray-300">-</button>
                            <span class="w-8 text-center text-xs font-semibold">${item.qty}</span>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-7 h-7 flex items-center justify-center text-gray-300">+</button>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');

            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl border border-gray-700">
                            <span class="text-xs font-semibold text-blue-400 flex items-center gap-2">
                                <img src="${LOGO_SRC}" class="w-5 h-5 rounded-full object-cover" alt="Logo"> Teller Entry Mode (${currentUser.email})
                            </span>
                            <span class="text-xs text-gray-400">Products available: ${products.length}</span>
                        </div>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" onkeyup="filterPOSProducts(this.value)" placeholder="Search products..." class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-gray-100 text-sm">
                        </div>
                        <div id="pos-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${itemsHTML}</div>
                    </div>

                    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-24">
                        <div>
                            <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-700">
                                <h2 class="font-bold text-lg text-gray-100">Current Order</h2>
                                <button onclick="clearCart()" class="text-xs text-red-400">Clear</button>
                            </div>
                            
                            <!-- Customer Selection & Separate Name, Address, Phone Inputs -->
                            <div class="space-y-2 mb-3">
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1">Select Existing Customer</label>
                                    <select id="cart-customer-select" onchange="onSelectCustomerChange(this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-200">
                                        <option value="">-- Direct / Walk-in Customer --</option>
                                        ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || 'N/A'})</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1">Customer Name (ग्राहकको नाम)</label>
                                    <input type="text" id="pos-customer-name" placeholder="Type customer name..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Address (ठेगाना)</label>
                                        <input type="text" id="pos-customer-address" placeholder="Damak" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Phone (फोन नम्बर)</label>
                                        <input type="text" id="pos-customer-phone" placeholder="9800000000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-100">
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-2 max-h-[140px] overflow-y-auto pr-1 border-t border-gray-700/50 pt-2">
                                ${currentCart.length === 0 ? '<div class="text-center py-4 text-gray-500 text-sm">Cart is empty</div>' : cartHTML}
                            </div>
                        </div>

                        <div class="pt-3 border-t border-gray-700 space-y-3">
                            <div class="flex justify-between text-lg font-bold">
                                <span class="text-gray-300">Grand Total:</span>
                                <span class="text-green-400">Rs. ${subtotal.toLocaleString()}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center gap-2 p-2.5 rounded-lg border border-gray-700 bg-gray-900 text-xs text-gray-200 cursor-pointer">
                                    <input type="radio" name="payment-method" value="Cash" checked> Cash
                                </label>
                                <label class="flex items-center justify-center gap-2 p-2.5 rounded-lg border border-gray-700 bg-gray-900 text-xs text-gray-200 cursor-pointer">
                                    <input type="radio" name="payment-method" value="Fonepay"> Fonepay
                                </label>
                            </div>
                            <button onclick="processCheckout()" class="w-full py-3 bg-green-600 hover:bg-green-500 font-semibold text-white rounded-xl shadow-lg flex items-center justify-center gap-2">
                                <i class="fa-solid fa-print"></i> Complete Sale & Print Bill
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function onSelectCustomerChange(custId) {
            if (!custId) {
                document.getElementById('pos-customer-name').value = '';
                document.getElementById('pos-customer-address').value = '';
                document.getElementById('pos-customer-phone').value = '';
                return;
            }
            const c = customers.find(cust => cust.id === custId);
            if (c) {
                document.getElementById('pos-customer-name').value = c.name || '';
                document.getElementById('pos-customer-address').value = c.address || '';
                document.getElementById('pos-customer-phone').value = c.phone || '';
            }
        }

        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product || product.stock <= 0) { showToast("Out of stock!", "error"); return; }
            const existing = currentCart.find(item => item.id === prodId);
            if (existing) {
                if (existing.qty + 1 > product.stock) { showToast("Stock limit reached!", "error"); return; }
                existing.qty += 1;
            } else {
                currentCart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            renderPOS();
        }

        function updateCartQty(idx, change) {
            const item = currentCart[idx];
            const product = products.find(p => p.id === item.id);
            const newQty = item.qty + change;
            if (newQty <= 0) { currentCart.splice(idx, 1); renderPOS(); return; }
            if (product && newQty > product.stock) { showToast("Stock limit reached!", "error"); return; }
            item.qty = newQty;
            renderPOS();
        }

        function removeFromCart(idx) { currentCart.splice(idx, 1); renderPOS(); }
        function clearCart() { currentCart = []; renderPOS(); }

        function filterPOSProducts(query) {
            const q = query.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q));
            document.getElementById('pos-product-grid').innerHTML = filtered.map(p => `
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer flex flex-col justify-between" onclick="addToCart('${p.id}')">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-100">${p.name}</h3>
                            <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full">Stock: ${p.stock}</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-700">
                        <span class="text-lg font-bold text-green-400">Rs. ${p.price}</span>
                        <button class="bg-blue-600 px-3 py-1 rounded-lg text-xs text-white">Add</button>
                    </div>
                </div>
            `).join('');
        }

        async function processCheckout() {
            if (currentCart.length === 0) { showToast("Cart is empty!", "error"); return; }
            
            const custSelectId = document.getElementById('cart-customer-select').value;
            const inputName = document.getElementById('pos-customer-name').value.trim();
            const inputAddress = document.getElementById('pos-customer-address').value.trim();
            const inputPhone = document.getElementById('pos-customer-phone').value.trim();

            const finalCustomerName = inputName || 'Walk-in Customer';
            const paymentMethod = document.querySelector('input[name="payment-method"]:checked')?.value || 'Cash';
            const total = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const sale = {
                id: 'INV-' + Date.now().toString().slice(-6),
                date: new Date().toISOString(),
                teller: currentUser.email,
                customerName: finalCustomerName,
                customerAddress: inputAddress,
                customerPhone: inputPhone,
                customerId: custSelectId || null,
                items: [...currentCart],
                total: total,
                paymentMethod: paymentMethod,
                status: 'completed'
            };

            for (let cartItem of currentCart) {
                const prod = products.find(p => p.id === cartItem.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - cartItem.qty);
                    if (prod.firebaseId) {
                        await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                    }
                }
            }

            const docRef = await db.collection('sales').add(sale);
            sales.unshift({ firebaseId: docRef.id, ...sale });

            showToast("Sale completed & recorded!");
            printSaleInvoice(sale);
            clearCart();
        }

        async function cancelSale(firebaseId) {
            if (userRole !== 'admin') {
                showToast("Only Admin can cancel sales!", "error");
                return;
            }
            if (!confirm("Are you sure you want to cancel/return this sale? Stock will be restored.")) return;

            const sale = sales.find(s => s.firebaseId === firebaseId);
            if (!sale || sale.status === 'cancelled') return;

            for (let item of sale.items) {
                const prod = products.find(p => p.id === item.id);
                if (prod) {
                    prod.stock += item.qty;
                    if (prod.firebaseId) {
                        await db.collection('products').doc(prod.firebaseId).update({ stock: prod.stock });
                    }
                }
            }

            await db.collection('sales').doc(firebaseId).update({ status: 'cancelled' });
            sale.status = 'cancelled';

            showToast("Sale cancelled & stock restored successfully!");
            renderStatements();
        }
