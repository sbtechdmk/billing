<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB TECH - Advanced Computer Shop Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6fe',
                            100: '#ddeafb',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Thermal & A4 Invoice Printable Styles */
        @media print {
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <header class="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <!-- Brand Info -->
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-blue-500/20 ring-2 ring-blue-400/30">
                    SB
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg text-white tracking-wide">SB TECH</h1>
                        <span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-semibold border border-emerald-500/30">PRO SHOP</span>
                    </div>
                    <p class="text-xs text-slate-400 flex items-center gap-2">
                        <span><i class="fa-solid fa-location-dot text-rose-400"></i> Damak-5, Jhapa</span>
                        <span class="hidden sm:inline">•</span>
                        <span class="hidden sm:inline">VAT: 600714930</span>
                    </p>
                </div>
            </div>

            <!-- Navigation Bar -->
            <nav class="flex items-center gap-1 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800/80 shadow-inner overflow-x-auto max-w-full">
                <button onclick="switchTab('pos')" id="tab-btn-pos" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 whitespace-nowrap bg-blue-600 text-white shadow-md shadow-blue-600/30">
                    <i class="fa-solid fa-cart-shopping"></i> POS Billing
                </button>
                <button onclick="switchTab('products')" id="tab-btn-products" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-boxes-stacked"></i> Inventory
                </button>
                <button onclick="switchTab('repairs')" id="tab-btn-repairs" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition flex items-center gap-2 whitespace-nowrap relative">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Repairs & Service
                    <span id="pending-repairs-badge" class="bg-amber-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.2 rounded-full hidden">0</span>
                </button>
                <button onclick="switchTab('customers')" id="tab-btn-customers" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-book-bookmark"></i> Credit Ledger
                </button>
                <button onclick="switchTab('reports')" id="tab-btn-reports" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-chart-pie"></i> Daily Reports
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6" id="tab-content">
        <!-- Tab Views dynamically rendered via JS -->
    </main>

    <!-- Toast Notifications Floating Stack -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Dynamic Modal Overlay Root -->
    <div id="modal-container"></div>

    <!-- Hidden Dedicated Thermal Print Sheet -->
    <div id="printable-area" class="hidden"></div>

    <script>
        // Initial Mock Master Data for Tech Shop
        const initialProducts = [
            { id: '101', name: 'Dell Vostro 15 3520 (i5 12th Gen / 8GB / 512GB)', price: 68000, stock: 6, category: 'Laptops', serials: 'SN-DEL-092, SN-DEL-093, SN-DEL-094' },
            { id: '102', name: 'HP LaserJet Pro M108a Printer', price: 21500, stock: 4, category: 'Printers', serials: 'CN-HPP-4411, CN-HPP-4412' },
            { id: '103', name: 'Hikvision 2MP Outdoor ColorVu CCTV Camera', price: 3400, stock: 18, category: 'CCTV & Security', serials: 'HK-CAM-9011' },
            { id: '104', name: 'TP-Link Archer C6 AC1200 Dual Band Router', price: 3800, stock: 12, category: 'Networking', serials: 'S/N: 2210098731' },
            { id: '105', name: 'D-Link Cat6 UTP Network Cable (305m Roll)', price: 8500, stock: 3, category: 'Networking', serials: 'N/A' },
            { id: '106', name: 'Samsung 24" IPS FHD Monitor (75Hz)', price: 17500, stock: 5, category: 'Monitors', serials: 'SAM-MON-7801' },
            { id: '107', name: 'Logitech MK215 Wireless Combo Mouse Keyboard', price: 2400, stock: 15, category: 'Accessories', serials: 'N/A' }
        ];

        const initialCustomers = [
            { id: 'c1', name: 'Ram Bahadur Thapa', phone: '9801234567', address: 'Damak-6, Jhapa', creditBalance: 4500 },
            { id: 'c2', name: 'Sita Sharma (Everest School)', phone: '9842345678', address: 'Damak-5, Jhapa', creditBalance: 12500 },
            { id: 'c3', name: 'Hari Prasad Dahal', phone: '9812398765', address: 'Urlabari-3, Morang', creditBalance: 0 }
        ];

        const initialRepairs = [
            { id: 'REP-1001', customerName: 'Suman Rai', phone: '9804561230', device: 'Acer Aspire 5 Laptop', serialNo: 'NXAT3SI001', complaint: 'No Display / Motherboard short circuit', estimatedCost: 4500, status: 'In Repair', date: new Date(Date.now() - 86400000 * 2).toISOString() },
            { id: 'REP-1002', customerName: 'Gita Adhikari', phone: '9816655443', device: 'Epson L3110 Printer', serialNo: 'EP-99882', complaint: 'Red light blinking / Paper jam issue', estimatedCost: 1200, status: 'Pending', date: new Date(Date.now() - 86400000).toISOString() }
        ];

        const initialSales = [
            {
                id: 'INV-882101',
                date: new Date(Date.now() - 3600000 * 4).toISOString(),
                customerName: 'Hari Prasad Dahal',
                customerId: 'c3',
                items: [{ id: '104', name: 'TP-Link Archer C6 AC1200 Dual Band Router', qty: 1, price: 3800 }],
                subtotal: 3800,
                discount: 0,
                total: 3800,
                paymentMethod: 'Fonepay'
            }
        ];

        // State variables initialized from LocalStorage
        let products = JSON.parse(localStorage.getItem('sbtech_products')) || initialProducts;
        let customers = JSON.parse(localStorage.getItem('sbtech_customers')) || initialCustomers;
        let repairs = JSON.parse(localStorage.getItem('sbtech_repairs')) || initialRepairs;
        let sales = JSON.parse(localStorage.getItem('sbtech_sales')) || initialSales;

        let currentCart = [];
        let cartDiscount = 0;
        let activeTab = 'pos';

        // Save State Helper
        function saveData() {
            localStorage.setItem('sbtech_products', JSON.stringify(products));
            localStorage.setItem('sbtech_customers', JSON.stringify(customers));
            localStorage.setItem('sbtech_repairs', JSON.stringify(repairs));
            localStorage.setItem('sbtech_sales', JSON.stringify(sales));
            updatePendingBadge();
        }

        function updatePendingBadge() {
            const pendingCount = repairs.filter(r => r.status === 'Pending' || r.status === 'In Repair').length;
            const badge = document.getElementById('pending-repairs-badge');
            if (badge) {
                if (pendingCount > 0) {
                    badge.innerText = pendingCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        // Toast Feedback System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            const bgColor = isSuccess ? 'bg-emerald-600' : (type === 'warning' ? 'bg-amber-600' : 'bg-rose-600');
            const icon = isSuccess ? 'fa-circle-check' : (type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-xmark');
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Navigation Tab Switching Logic
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition flex items-center gap-2 whitespace-nowrap relative";
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) {
                activeBtn.className = "px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 whitespace-nowrap bg-blue-600 text-white shadow-md shadow-blue-600/30 relative";
            }

            if (tab === 'pos') renderPOS();
            else if (tab === 'products') renderProducts();
            else if (tab === 'repairs') renderRepairs();
            else if (tab === 'customers') renderCustomers();
            else if (tab === 'reports') renderReports();
            
            updatePendingBadge();
        }

        function renderPOS() {
            const container = document.getElementById('tab-content');
            
            let itemsHTML = products.map(p => `
                <div class="bg-slate-900 border border-slate-800/80 hover:border-blue-500/50 rounded-2xl p-4 transition-all hover:shadow-xl hover:shadow-blue-950/20 flex flex-col justify-between group" onclick="addToCart('${p.id}')">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400 bg-blue-950/60 px-2 py-0.5 rounded-md border border-blue-800/40">${p.category || 'General'}</span>
                            <span class="text-xs font-semibold ${p.stock > 2 ? 'text-slate-400' : 'text-amber-400 font-bold'}">
                                ${p.stock > 0 ? `<i class="fa-solid fa-box text-[10px]"></i> ${p.stock} in stock` : '<span class="text-rose-400"><i class="fa-solid fa-ban"></i> Out of Stock</span>'}
                            </span>
                        </div>
                        <h3 class="font-semibold text-sm text-slate-100 group-hover:text-blue-300 transition-colors line-clamp-2">${p.name}</h3>
                        ${p.serials && p.serials !== 'N/A' ? `<p class="text-[11px] font-mono-code text-slate-500 mt-1 truncate" title="${p.serials}"><i class="fa-solid fa-barcode text-[10px]"></i> ${p.serials}</p>` : ''}
                    </div>
                    <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-800/60">
                        <div>
                            <span class="text-[10px] text-slate-400 block">NPR Price</span>
                            <span class="text-base font-extrabold text-emerald-400">Rs. ${p.price.toLocaleString()}</span>
                        </div>
                        <button class="bg-blue-600/20 group-hover:bg-blue-600 text-blue-300 group-hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                            <i class="fa-solid fa-plus font-bold"></i> Add
                        </button>
                    </div>
                </div>
            `).join('');

            let cartHTML = currentCart.map((item, idx) => `
                <div class="flex items-center justify-between p-3 bg-slate-950/80 rounded-xl border border-slate-800/80 text-xs">
                    <div class="flex-1 pr-2">
                        <div class="font-semibold text-slate-200 line-clamp-1">${item.name}</div>
                        <div class="text-slate-400 text-[11px] mt-0.5">Rs. ${item.price.toLocaleString()} × ${item.qty} = <strong class="text-emerald-400">Rs. ${(item.price * item.qty).toLocaleString()}</strong></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-900 rounded-lg border border-slate-700/80 overflow-hidden">
                            <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:bg-slate-800 transition">-</button>
                            <span class="w-7 text-center font-bold text-slate-100 text-xs">${item.qty}</span>
                            <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:bg-slate-800 transition">+</button>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-slate-500 hover:text-rose-400 p-1 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            const itemsSubtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, itemsSubtotal - cartDiscount);

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Left: Inventory Browser -->
                    <div class="lg:col-span-7 xl:col-span-8 space-y-4">
                        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800">
                            <div class="relative w-full sm:w-80">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                <input type="text" id="pos-search" onkeyup="filterPOSProducts(this.value)" placeholder="Search products, serials, category..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500">
                            </div>
                            <div class="flex items-center gap-2 text-xs text-slate-400 w-full sm:w-auto overflow-x-auto">
                                <span class="font-semibold text-slate-300">Filter:</span>
                                <button onclick="filterPOSCategory('all')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200">All</button>
                                <button onclick="filterPOSCategory('Laptops')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200">Laptops</button>
                                <button onclick="filterPOSCategory('CCTV & Security')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200">CCTV</button>
                                <button onclick="filterPOSCategory('Networking')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200">Networking</button>
                            </div>
                        </div>

                        <div id="pos-product-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[calc(100vh-210px)] overflow-y-auto pr-1">
                            ${itemsHTML}
                        </div>
                    </div>

                    <!-- Right: Checkout Cart Panel -->
                    <div class="lg:col-span-5 xl:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between h-fit lg:sticky lg:top-20 shadow-2xl">
                        <div>
                            <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
                                <h2 class="font-bold text-base text-slate-100 flex items-center gap-2">
                                    <i class="fa-solid fa-receipt text-blue-500"></i> Active Sales Cart
                                </h2>
                                <button onclick="clearCart()" class="text-xs text-rose-400 hover:underline flex items-center gap-1">
                                    <i class="fa-solid fa-rotate-right"></i> Reset Cart
                                </button>
                            </div>

                            <!-- Customer Picker -->
                            <div class="mb-4 space-y-1">
                                <label class="block text-xs font-semibold text-slate-400">Customer (ग्राहक)</label>
                                <select id="cart-customer" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                                    <option value="">Walk-in Customer (नगदी ग्राहक)</option>
                                    ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || 'No phone'}) - Credit: Rs. ${c.creditBalance}</option>`).join('')}
                                </select>
                            </div>

                            <!-- Cart Items List -->
                            <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1 mb-4">
                                ${currentCart.length === 0 ? `
                                    <div class="text-center py-10 border border-dashed border-slate-800 rounded-xl">
                                        <i class="fa-solid fa-cart-flatbed text-3xl text-slate-700 mb-2"></i>
                                        <p class="text-xs text-slate-500">Cart is empty. Click items to add.</p>
                                    </div>
                                ` : cartHTML}
                            </div>
                        </div>

                        <!-- Summary & Checkout Controls -->
                        <div class="pt-4 border-t border-slate-800 space-y-3">
                            <div class="space-y-1.5 text-xs">
                                <div class="flex justify-between text-slate-400">
                                    <span>Items Subtotal:</span>
                                    <span class="text-slate-200 font-semibold">Rs. ${itemsSubtotal.toLocaleString()}</span>
                                </div>
                                <div class="flex justify-between items-center text-slate-400">
                                    <span>Discount (छुट):</span>
                                    <div class="flex items-center gap-1">
                                        <span class="text-slate-500">Rs.</span>
                                        <input type="number" id="cart-discount-input" value="${cartDiscount}" onchange="updateDiscount(this.value)" min="0" class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2 py-0.5 text-right text-xs text-emerald-400 font-bold focus:outline-none focus:border-blue-500">
                                    </div>
                                </div>
                                <div class="flex justify-between text-base font-extrabold text-slate-100 pt-2 border-t border-slate-800">
                                    <span>Grand Total:</span>
                                    <span class="text-emerald-400">Rs. ${grandTotal.toLocaleString()}</span>
                                </div>
                            </div>

                            <!-- Payment Options -->
                            <div class="pt-2">
                                <label class="block text-xs font-semibold text-slate-400 mb-2">Payment Method (भुक्तानीको प्रकार)</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <label class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-800 bg-slate-950/60 hover:border-emerald-500/50 cursor-pointer text-[11px] font-semibold text-slate-300 transition has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-950/30 has-[:checked]:text-emerald-400">
                                        <input type="radio" name="payment-method" value="Cash" checked class="hidden">
                                        <i class="fa-solid fa-money-bill-wave text-base mb-1 text-emerald-400"></i>
                                        Cash
                                    </label>
                                    <label class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-800 bg-slate-950/60 hover:border-purple-500/50 cursor-pointer text-[11px] font-semibold text-slate-300 transition has-[:checked]:border-purple-500 has-[:checked]:bg-purple-950/30 has-[:checked]:text-purple-400">
                                        <input type="radio" name="payment-method" value="Fonepay" class="hidden">
                                        <i class="fa-solid fa-qrcode text-base mb-1 text-purple-400"></i>
                                        Fonepay
                                    </label>
                                    <label class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-800 bg-slate-950/60 hover:border-amber-500/50 cursor-pointer text-[11px] font-semibold text-slate-300 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-950/30 has-[:checked]:text-amber-400">
                                        <input type="radio" name="payment-method" value="Credit" class="hidden">
                                        <i class="fa-solid fa-book text-base mb-1 text-amber-400"></i>
                                        Credit (उधारो)
                                    </label>
                                </div>
                            </div>

                            <button onclick="processCheckout()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold text-white rounded-xl shadow-lg shadow-blue-900/40 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-print text-sm"></i> Print Bill & Save Transaction
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addToCart(prodId) {
            const product = products.find(p => p.id === prodId);
            if (!product || product.stock <= 0) {
                showToast("Selected item is out of stock!", "error");
                return;
            }

            const existingIdx = currentCart.findIndex(item => item.id === prodId);
            if (existingIdx > -1) {
                if (currentCart[existingIdx].qty + 1 > product.stock) {
                    showToast("Cannot add more than available stock limit!", "warning");
                    return;
                }
                currentCart[existingIdx].qty += 1;
            } else {
                currentCart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    qty: 1
                });
            }
            renderPOS();
        }

        function updateCartQty(idx, change) {
            const item = currentCart[idx];
            const product = products.find(p => p.id === item.id);
            const newQty = item.qty + change;

            if (newQty <= 0) {
                removeFromCart(idx);
                return;
            }

            if (product && newQty > product.stock) {
                showToast("Stock limit reached for this product!", "warning");
                return;
            }

            item.qty = newQty;
            renderPOS();
        }

        function removeFromCart(idx) {
            currentCart.splice(idx, 1);
            renderPOS();
        }

        function clearCart() {
            currentCart = [];
            cartDiscount = 0;
            renderPOS();
        }

        function updateDiscount(val) {
            cartDiscount = Math.max(0, parseFloat(val) || 0);
            renderPOS();
        }

        function filterPOSProducts(query) {
            const q = query.toLowerCase();

        function processCheckout() {
            if (currentCart.length === 0) {
                showToast("Cart is empty! Add products first.", "warning");
                return;
            }

            const customerId = document.getElementById('cart-customer').value;
            const customerObj = customers.find(c => c.id === customerId);
            const paymentMethod = document.querySelector('input[name="payment-method"]:checked')?.value || 'Cash';

            if (paymentMethod === 'Credit' && !customerObj) {
                showToast("Credit/उधारो sales require selecting a registered customer!", "error");
                return;
            }

            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - cartDiscount);

            const sale = {
                id: 'INV-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString(),
                customerName: customerObj ? customerObj.name : 'Walk-in Customer',
                customerId: customerId || null,
                items: [...currentCart],
                subtotal: subtotal,
                discount: cartDiscount,
                total: grandTotal,
                paymentMethod: paymentMethod
            };

            // Deduct Stock
            currentCart.forEach(cartItem => {
                const prod = products.find(p => p.id === cartItem.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - cartItem.qty);
                }
            });

            // Update Credit Balance if Credit Payment
            if (paymentMethod === 'Credit' && customerObj) {
                customerObj.creditBalance += grandTotal;
            }

            sales.unshift(sale);
            saveData();

            showToast(`Sale completed via ${paymentMethod}!`);
            showReceiptModal(sale);
            clearCart();
        }

                id: 'REP-' + Math.floor(1000 + Math.random() * 9000),
                customerName,
                phone,
                device,
                serialNo,
                complaint,
                estimatedCost,
                status: 'Pending',
                date: new Date().toISOString()
            });

            saveData();
            closeModal();
            renderRepairs();
            showToast("Repair ticket created!");
        }

        function updateRepairStatus(idx, newStatus) {
            repairs[idx].status = newStatus;
            saveData();
            showToast(`Repair status updated to ${newStatus}`);
            renderRepairs();
        }

                                        <th class="py-3.5 px-4">Customer Name</th>
                                        <th class="py-3.5 px-4">Phone Number</th>

                        </div>
                        <form onsubmit="saveCustomer(event)" class="space-y-4 text-xs">

        function saveCustomer(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            customers.push({
                id: 'c' + Date.now().toString().slice(-5),
                name,
                phone,
                address,
                creditBalance: 0
            });

            saveData();
            closeModal();
            renderCustomers();
            showToast("Customer registered successfully!");
        }

        function openCollectPaymentModal(custId) {
            const customer = customers.find(c => c.id === custId);

            const modal = document.getElementById('modal-container');

                    </div>

            `;
        }

        function processCreditPayment(e, custId) {
            e.preventDefault();
            const customer = customers.find(c => c.id === custId);
            const amount = parseFloat(document.getElementById('pay-amount').value);
            const payMethod = document.querySelector('input[name="collect-method"]:checked')?.value || 'Cash';

            if (customer && amount > 0) {
                customer.creditBalance = Math.max(0, customer.creditBalance - amount);
                
                // Record collection in sales ledger
                sales.unshift({
                    id: 'REC-' + Math.floor(100000 + Math.random() * 900000),
                    date: new Date().toISOString(),
                    customerName: customer.name + ' (Dues Collection)',
                    customerId: customer.id,
                    items: [{ name: 'Credit Ledger Clearance', qty: 1, price: amount }],
                    subtotal: amount,
                    discount: 0,
                    total: amount,
                    paymentMethod: payMethod
                });

                saveData();
                closeModal();
                renderCustomers();
                showToast(`Collected Rs. ${amount.toLocaleString()} via ${payMethod}!`);
            }
        }

                    <td class="py-3.5 px-4 font-semibold text-slate-100">${s.customerName}</td>

                        ${s.paymentMethod === 'Fonepay' 
                            ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20"><i class="fa-solid fa-qrcode"></i> Fonepay</span>'
                            : (s.paymentMethod === 'Credit'

            `).join('');

            container.innerHTML = `

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

                                <h3 class="text-xl font-extrabold text-emerald-300 mt-1">Rs. ${cashRevenue.toLocaleString()}</h3>
                            </div>
                            <div class="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-400">
                                <i class="fa-solid fa-money-bill-wave text-lg"></i>
                            </div>
                        </div>

                        <div class="bg-slate-900 p-5 rounded-2xl border border-purple-500/30 flex justify-between items-center shadow-lg">
                            <div>
                                <p class="text-[10px] font-bold text-purple-400 uppercase tracking-wider">Fonepay Collection</p>

                            <div class="w-10 h-10 bg-rose-500/10 rounded-xl flex items-center justify-center text-rose-400">
                                <i class="fa-solid fa-hand-holding-dollar text-lg"></i>

                    </div>

                    <!-- Invoice History Log -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">

                                    <tr class="border-b border-slate-800 bg-slate-950/80 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="py-3.5 px-4">Invoice #</th>
                                        <th class="py-3.5 px-4">Date & Time</th>
                                        <th class="py-3.5 px-4">Customer</th>
                                        <th class="py-3.5 px-4">Payment Method</th>
                                        <th class="py-3.5 px-4">Total Amount</th>
                                        <th class="py-3.5 px-4">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sales.length === 0 ? '<tr><td colspan="6" class="text-center py-8 text-slate-500 text-xs">No sales recorded yet.</td></tr>' : salesRows}

                        </div>

                    <div style="text-align: center; margin-top: 20px; border-top: 1px dashed #000; padding-top: 10px; font-size: 10px;">

        function closeModal() {

        // Initialize App on Window Load
        window.onload = function() {

        };
